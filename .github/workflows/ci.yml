name: CI - Pio
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Django, API e arquivos estaticos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Construir aplicacao
        run: docker build -t pio-ci .
      - name: Verificar configuracao e migracoes
        run: |
          docker run --rm pio-ci python manage.py check
          docker run --rm pio-ci python manage.py makemigrations --check --dry-run
      - name: Executar testes
        run: docker run --rm -e SQLITE_DB_PATH=/tmp/pio-tests.sqlite3 pio-ci python manage.py test --verbosity 2
      - name: Validar estaticos com DEBUG desativado
        run: docker run --rm -e DJANGO_DEBUG=0 -e DJANGO_SECRET_KEY="$(openssl rand -hex 48)" pio-ci python manage.py collectstatic --noinput --dry-run
